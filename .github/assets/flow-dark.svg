<text x="556" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#525252" opacity="1">04</text>
<text x="556" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#fafafa" font-weight="600"><tspan x="556" dy="0">Fire</tspan></text>
<text x="556" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a3a3a3"><tspan x="556" dy="0">Quiet hours,</tspan><tspan x="556" dy="19">snooze and</tspan><tspan x="556" dy="19">redeliver apply.</tspan></text>
